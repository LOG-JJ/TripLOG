name: TripLOG collaboration regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno test --node-modules-dir=auto --no-lock --allow-env supabase/functions/triplog-sync/handler_test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: .test-output/
