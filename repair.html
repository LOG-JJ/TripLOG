<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>TripLOG 접속 복구</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#172440;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{max-width:440px;width:100%;background:#fff;border:1px solid #dfe7f0;border-radius:20px;padding:32px}h1{font-size:24px;line-height:1.4;margin:16px 0}p{line-height:1.7;color:#526680}strong{font-size:18px}button{font:inherit;background:#ffcc00;border:0;border-radius:10px;padding:12px 18px;color:#172440;cursor:pointer}small{display:block;color:#6c7c91;line-height:1.6;margin-top:24px}
  </style>
</head>
<body>
  <main><strong>TripLOG</strong><h1>접속을 복구하고 있어요</h1><p id="status" role="status">최신 화면을 준비하고 있습니다. 잠시만 기다려 주세요.</p><button id="retry" hidden>다시 시도</button><small>저장된 여행·작성 중인 초안·로그인 정보는 그대로 유지됩니다.</small></main>
  <script>
    const status = document.getElementById('status'), retry = document.getElementById('retry');
    async function repair() {
      retry.hidden = true;
      try {
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
          await registration.update();
          const worker = registration.installing || registration.waiting;
          if (worker && worker.state !== 'activated') await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('복구 연결이 지연되고 있습니다. 다시 시도해 주세요.')), 45000);
            const check = () => {
              if (worker.state === 'installed') worker.postMessage({ type: 'TRIPLOG_REPAIR_NAVIGATION' });
              if (worker.state === 'activated') { clearTimeout(timeout); worker.removeEventListener('statechange',check); resolve(); }
              if (worker.state === 'redundant') { clearTimeout(timeout); worker.removeEventListener('statechange',check); reject(new Error('최신 화면을 다시 준비해 주세요.')); }
            };
            worker.addEventListener('statechange',check);check();
          });
          await navigator.serviceWorker.ready;
        }
        status.textContent = '복구했습니다. 여행 화면으로 이동합니다.';
        location.replace('/Travel?page=overview');
      } catch (error) { status.textContent = error.message || '연결을 확인한 뒤 다시 시도해 주세요.'; retry.hidden = false; }
    }
    retry.addEventListener('click',repair);repair();
  </script>
</body>
</html>
